<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Для Элики</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #title {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh);
      text-align: center;
      font-family: "Marck Script", "Segoe Script", "Brush Script MT", cursive;
      font-size: clamp(40px, 11vw, 88px);
      color: #dbeafe;
      text-shadow: 0 0 8px #60a5fa, 0 0 22px #2563eb, 0 0 46px #1d4ed8;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Для Элики</div>
<script>
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let width, height, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  const BLUE_SHADES = [
    "#3b82f6", "#60a5fa", // blue-500, blue-400
    "#93c5fd", "#2563eb", // blue-300, blue-600
    "#bfdbfe", "#1d4ed8", // blue-200, blue-700
  ];

  /* ---------- 3D-сердце ---------- */

  // Неявная формула сердца: x — вправо, z — вверх, y — глубина. f <= 0 внутри.
  function heartF(x, y, z) {
    const a = x * x + 2.25 * y * y + z * z - 1;
    return a * a * a - x * x * z * z * z - 0.1125 * y * y * z * z * z;
  }

  // Набор точек внутри объёма сердца (больше плотность у поверхности)
  const TARGETS = [];
  while (TARGETS.length < 2500) {
    const x = (Math.random() - 0.5) * 2.8;
    const y = (Math.random() - 0.5) * 2.8;
    const z = (Math.random() - 0.5) * 2.8;
    const f = heartF(x, y, z);
    if (f > 0) continue;
    if (f > -0.12 || Math.random() < 0.25) TARGETS.push({ x, y, z });
  }

  // Поворот: yaw вокруг вертикальной оси, pitch — наклон
  let yaw = 0, pitch = -0.15;
  let yawVel = 0.006;          // автоповорот
  const AUTO_SPEED = 0.006;
  let dragging = false, moved = 0, lastX = 0, lastY = 0;

  function geom() {
    return { cx: width / 2, cy: height * 0.40, size: Math.min(width, height) * 0.30 };
  }

  function project(x, y, z) {
    const g = geom();
    const cy_ = Math.cos(yaw), sy = Math.sin(yaw);
    const xr = x * cy_ + y * sy;
    let d = -x * sy + y * cy_;
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const zr = z * cp - d * sp;
    d = z * sp + d * cp;
    const persp = 1 / (1 - d * 0.28);
    return {
      sx: g.cx + xr * g.size * persp,
      sy: g.cy - zr * g.size * persp + g.size * 0.1,
      persp,
      depth: d,
    };
  }

  /* ---------- Частицы ---------- */

  // Для burst-частиц: контур сердца в 2D
  function heartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    return { x: x / 17, y: y / 17 };
  }

  class Particle {
    constructor(x, y, type) {
      this.type = type;
      this.color = BLUE_SHADES[(Math.random() * BLUE_SHADES.length) | 0];
      this.size = Math.random() * 1.4 + 0.5;
      this.life = 0;

      if (type === "float") {
        // старт: случайная точка в пространстве вокруг сердца
        this.x = (Math.random() - 0.5) * 3;
        this.y = (Math.random() - 0.5) * 3;
        this.z = (Math.random() - 0.5) * 3;
        this.maxLife = 240 + Math.random() * 240;
        this.pickTarget();
      } else {
        this.x = x;
        this.y = y;
        const dir = heartPoint(Math.random() * Math.PI * 2);
        const speed = 2 + Math.random() * 3.5;
        this.vx = dir.x * speed;
        this.vy = dir.y * speed;
        this.maxLife = 60 + Math.random() * 50;
      }
    }

    pickTarget() {
      this.t = TARGETS[(Math.random() * TARGETS.length) | 0];
    }

    update() {
      this.life++;
      if (this.type === "float") {
        this.x += (this.t.x - this.x) * 0.03 + (Math.random() - 0.5) * 0.012;
        this.y += (this.t.y - this.y) * 0.03 + (Math.random() - 0.5) * 0.012;
        this.z += (this.t.z - this.z) * 0.03 + (Math.random() - 0.5) * 0.012;
        if (this.life >= this.maxLife) {
          this.life = 0;
          this.pickTarget();
        }
      } else {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.97;
        this.vy *= 0.97;
      }
    }

    get dead() {
      return this.type === "burst" && this.life >= this.maxLife;
    }

    draw() {
      const k = Math.min(this.life / this.maxLife, 1);
      if (this.type === "float") {
        const p = project(this.x, this.y, this.z);
        const depthFade = 0.55 + 0.45 * (p.depth + 1) / 2; // дальние частицы тусклее
        ctx.globalAlpha = Math.sin(Math.PI * k) * 0.95 * Math.max(0.3, Math.min(1, depthFade));
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, this.size * p.persp, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.globalAlpha = Math.max(0, 1 - k);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  const floatParticles = [];
  const burstParticles = [];
  const FLOAT_COUNT = 1800;

  for (let i = 0; i < FLOAT_COUNT; i++) {
    const p = new Particle(0, 0, "float");
    p.life = Math.random() * p.maxLife; // stagger starting life
    floatParticles.push(p);
  }

  function spawnHeartBurst(x, y) {
    const count = 140;
    for (let i = 0; i < count; i++) {
      burstParticles.push(new Particle(x, y, "burst"));
    }
  }

  /* ---------- Управление: вращение drag'ом, тап — вспышка ---------- */

  canvas.addEventListener("pointerdown", (e) => {
    dragging = true;
    moved = 0;
    lastX = e.clientX;
    lastY = e.clientY;
    yawVel = 0;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    yaw += dx * 0.008;
    yawVel = dx * 0.008;
    pitch = Math.max(-0.7, Math.min(0.7, pitch + dy * 0.005));
  });

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    if (moved < 6) spawnHeartBurst(e.clientX, e.clientY);
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", () => { dragging = false; });

  /* ---------- Светящаяся платформа ---------- */

  function drawBase(time) {
    const g = geom();
    const by = g.cy + g.size * 1.32;
    const pulse = 1 + Math.sin(time / 600) * 0.06;
    const rx = g.size * 0.6 * pulse;
    const ry = g.size * 0.14 * pulse;

    ctx.save();
    ctx.globalAlpha = 1;
    ctx.translate(g.cx, by);
    ctx.scale(1, ry / rx);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    grad.addColorStop(0, "rgba(96,200,255,0.95)");
    grad.addColorStop(0.5, "rgba(37,99,235,0.55)");
    grad.addColorStop(1, "rgba(29,78,216,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, rx, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* ---------- Цикл анимации ---------- */

  function animate(time) {
    if (!dragging) {
      // плавно возвращаемся к автоповороту
      yawVel += (AUTO_SPEED - yawVel) * 0.03;
      yaw += yawVel;
    }

    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(0, 0, 0, 0.25)"; // шлейф
    ctx.fillRect(0, 0, width, height);

    drawBase(time);

    ctx.globalCompositeOperation = "lighter";
    for (const p of floatParticles) { p.update(); p.draw(); }
    for (let i = burstParticles.length - 1; i >= 0; i--) {
      const p = burstParticles[i];
      p.update();
      if (p.dead) { burstParticles.splice(i, 1); continue; }
      p.draw();
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
</script>
</body>
</html>
